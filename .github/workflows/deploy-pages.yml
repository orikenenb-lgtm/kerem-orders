name: Deploy landing page to GitHub Pages

# SAFETY: deploys run from main ONLY. A feature-branch push must never
# overwrite the live site — the branch trigger that used to sit here did
# exactly that (any push to it replaced production without a merge).
on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Don't cancel an in-flight deploy: a rapid second push to main should queue
  # behind the running production deployment rather than abort it mid-publish
  # (matches GitHub's own Pages workflow template).
  cancel-in-progress: false

jobs:
  build:
    # Belt-and-braces for workflow_dispatch: even a manual run can only ever
    # build/deploy main — dispatching from any other ref is a no-op.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag can
      # never swap the code this workflow runs (the comment tracks the version).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs no Git auth after the clone — keep the token out of
          # the local git config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 reached end-of-life in April 2026 — build on the active LTS.
          node-version: "24"
          # Cache npm downloads across deploys (CI already does this) — faster
          # `npm ci`, no behavioural change.
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      # Turnstile is REQUIRED in production: a signup form built without the
      # public site key can never submit. Fail the deploy loudly BEFORE build
      # rather than publish a broken registration flow. Set the site key as a
      # repository Actions Variable named TURNSTILE_SITE_KEY (a public value —
      # not a secret). The value is never echoed.
      - name: Require production Turnstile site key
        env:
          SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "${SITE_KEY}" ]; then
            echo "::error::TURNSTILE_SITE_KEY repository Variable is not set — refusing to deploy a signup form that cannot pass the captcha. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Turnstile site key is configured (length only): ${#SITE_KEY} chars"
      - name: Build (with public Turnstile site key baked in)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build
      # SECURITY / SCOPE: the Pages artifact contains ONLY the built Kerem
      # Toys site (landing/out). Nothing from docs/ or any other directory is
      # ever copied in — an earlier version of this workflow copied the whole
      # docs/ directory (internal AUDIT/HANDOVER/QA/ROLLBACK documents
      # included) to a public /crps path. Those presentation files have since
      # been removed from the repository entirely — see docs/security-notes.md.
      # NOTE: since v4 hidden files (dotfiles) are excluded from the artifact
      # by default — verified that landing/out contains none, so nothing is
      # lost by the upgrade.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
