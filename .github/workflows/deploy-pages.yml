name: Deploy landing page to GitHub Pages

# SAFETY: deploys run from main ONLY. A feature-branch push must never
# overwrite the live site — the branch trigger that used to sit here did
# exactly that (any push to it replaced production without a merge).
on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Belt-and-braces for workflow_dispatch: even a manual run can only ever
    # build/deploy main — dispatching from any other ref is a no-op.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      # SECURITY / SCOPE: the Pages artifact contains ONLY the built Kerem
      # Toys site (landing/out). Nothing from docs/ or any other directory is
      # ever copied in — an earlier version of this workflow copied the whole
      # docs/ directory (internal AUDIT/HANDOVER/QA/ROLLBACK documents
      # included) to a public /crps path. The CRPS presentation source files
      # remain in the repo but are NOT published.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
