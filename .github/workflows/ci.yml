# PR checks for the store front end. Runs the full verification battery and
# NOTHING else — this workflow must never deploy, publish, or touch Pages.
# (Deploys happen only in deploy-pages.yml, only from main.)
name: CI

on:
  # `ready_for_review` is listed explicitly because it is NOT in the default set
  # (opened, synchronize, reopened). Without it a pull request opened as a draft
  # and later marked ready runs no checks at all on that transition — which is
  # exactly the moment someone is about to merge it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # main itself was never verified. Every check ran on the PR head and nothing
  # ran on the merge result, so a semantic conflict between two PRs that each
  # passed alone — one renames an export, the other adds a caller of the old
  # name — landed on main green and was found by the deploy, or by a customer.
  # This job does not deploy; it only says whether main is currently sound.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      # Third-party actions are pinned to full commit SHAs so a moved tag can
      # never swap the code this workflow runs (the comment tracks the version).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm ci can run dependency lifecycle scripts; nothing after checkout
          # needs Git auth, so don't leave the token in the local git config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 reached end-of-life in April 2026 — build on the active LTS.
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install (clean)
        run: npm ci
      # A warning ratchet, not a warning ban. `eslint .` exits 0 on warnings, so
      # this step could not fail no matter what was pushed — it was decoration.
      # The repo carries 33 known warnings today (mostly react-hooks
      # set-state-in-effect in older screens); the bound is set to exactly that,
      # so the 34th fails the build and the number can only be walked down.
      # Lower this when warnings are fixed; do not raise it to make CI green.
      - name: Lint
        run: npm run lint -- --max-warnings 33
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build (static export)
        run: npm run build
