<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070f;
    --bg2:#070d1c;
    --cyan:#5fe4ff;
    --cyan-dim:#2b9fc4;
    --cyan-deep:#0e4c66;
    --amber:#ffb648;
    --green:#4ee6a8;
    --text:#bfe9f7;
    --muted:#5d8ba3;
    --hud-line:rgba(95,228,255,.18);
    --panel:rgba(8,10,26,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 900px at 50% 48%, #0a1430 0%, transparent 60%),
      radial-gradient(1400px 1000px at 50% 50%, rgba(14,76,102,.22) 0%, transparent 62%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, #03060d 100%);
    color:var(--text);
    font-family:'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #sphere{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- overlays ---------- */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.85) 100%);
  }
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.16;
    background:repeating-linear-gradient(180deg, rgba(95,228,255,.10) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen;
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>");
  }

  .hud{position:fixed;inset:0;z-index:10;pointer-events:none}
  .hud > *{pointer-events:auto}

  .label{
    font-family:'Orbitron',ui-sans-serif,system-ui,sans-serif;
    font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan-dim);
  }
  .rule{height:1px;background:linear-gradient(90deg,var(--hud-line),transparent);margin:7px 0 10px}

  /* ---------- top left ---------- */
  .tl{position:absolute;top:26px;left:30px;max-width:34vw}
  .brand{
    font-family:'Orbitron',sans-serif;font-weight:900;font-size:26px;letter-spacing:.42em;
    color:#eafcff;
    text-shadow:0 0 14px rgba(95,228,255,.65), 0 0 40px rgba(95,228,255,.25);
  }
  .brand span{color:var(--cyan)}
  .sub{margin-top:7px;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .greeting{margin-top:16px;font-size:15px;color:var(--text);letter-spacing:.04em;line-height:1.5;max-width:30ch}
  .gen{margin-top:6px;font-size:10.5px;color:var(--cyan-dim);letter-spacing:.14em}

  /* ---------- top right ---------- */
  .tr{position:absolute;top:26px;right:30px;text-align:right;min-width:212px}
  .clock{
    font-family:'Orbitron',sans-serif;font-weight:500;font-size:30px;letter-spacing:.13em;color:#eafcff;
    text-shadow:0 0 16px rgba(95,228,255,.5);font-variant-numeric:tabular-nums;
  }
  .clock small{font-size:12px;color:var(--cyan-dim);letter-spacing:.2em;margin-left:6px}
  .date{font-size:10.5px;color:var(--muted);letter-spacing:.18em;margin-top:3px;text-transform:uppercase}
  .conns{margin-top:16px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .conn{display:flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.1em;color:var(--text)}
  .conn .nm{opacity:.9}
  .conn .st{font-size:9px;letter-spacing:.18em;color:var(--muted);min-width:52px;text-align:right}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;order:3}
  .dot.on{background:var(--green);box-shadow:0 0 9px var(--green),0 0 18px rgba(78,230,168,.5)}
  .dot.off{background:var(--amber);box-shadow:0 0 9px var(--amber);animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}

  /* ---------- left activity log ---------- */
  .ll{position:absolute;left:30px;top:44%;transform:translateY(-38%);width:310px}
  .log{display:flex;flex-direction:column;gap:6px;min-height:186px;overflow:hidden;justify-content:flex-start}
  .log li{
    list-style:none;font-size:11.5px;color:var(--muted);letter-spacing:.06em;line-height:1.45;
    display:flex;gap:9px;opacity:0;transform:translateX(-8px);
    animation:slidein .45s ease forwards;
  }
  .log li .t{color:var(--cyan-deep);flex:0 0 auto}
  .log li.fresh{color:var(--cyan)}
  @keyframes slidein{to{opacity:1;transform:none}}
  .caret{display:inline-block;width:7px;height:12px;background:var(--cyan);animation:blink 1s steps(1,end) infinite;vertical-align:-2px}

  /* ---------- right stats ---------- */
  .rr{position:absolute;right:30px;top:44%;transform:translateY(-32%);width:262px}
  .bar{margin-bottom:13px}
  .bar .bl{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;margin-bottom:5px}
  .bar .bl b{font-weight:400;color:#dff6ff;font-variant-numeric:tabular-nums}
  .bar .bl span{color:var(--muted);text-transform:uppercase;font-size:9.5px;letter-spacing:.18em}
  .track{height:3px;background:rgba(95,228,255,.10);border-radius:2px;overflow:hidden}
  .fill{
    height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,var(--cyan-deep),var(--cyan));
    box-shadow:0 0 10px rgba(95,228,255,.75);
    transition:width 1.4s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- bottom figures ---------- */
  .bottom{position:absolute;left:0;right:0;bottom:134px;display:flex;justify-content:center;gap:58px;flex-wrap:wrap;padding:0 30px}
  .fig{text-align:center;min-width:120px}
  .fig .v{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:34px;color:#eafcff;letter-spacing:.05em;
    text-shadow:0 0 18px rgba(95,228,255,.45);font-variant-numeric:tabular-nums;
  }
  .fig .k{font-size:9px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;margin-top:5px}
  .chip{
    position:absolute;bottom:82px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:9px;
    padding:7px 15px;border:1px solid rgba(255,182,72,.45);border-radius:999px;
    background:rgba(255,182,72,.07);color:var(--amber);
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    box-shadow:0 0 22px rgba(255,182,72,.16);
  }
  .chip.show{display:flex}
  .chip .d{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber);animation:blink 1.3s steps(1,end) infinite}

  /* ---------- bottom bar ---------- */
  .bar-bottom{
    position:absolute;left:0;right:0;bottom:0;height:64px;
    display:flex;align-items:center;gap:22px;padding:0 30px;
    border-top:1px solid var(--hud-line);
    background:linear-gradient(180deg,transparent,rgba(4,7,15,.88));
    backdrop-filter:blur(3px);
  }
  .btn{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:.24em;
    color:#04121a;background:linear-gradient(180deg,#8af0ff,var(--cyan));
    border:none;border-radius:3px;padding:12px 22px;cursor:pointer;white-space:nowrap;
    box-shadow:0 0 20px rgba(95,228,255,.55),0 0 44px rgba(95,228,255,.22);
    transition:transform .12s ease, box-shadow .25s ease, filter .2s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(95,228,255,.8),0 0 60px rgba(95,228,255,.35)}
  .btn:active{transform:translateY(0)}
  .btn.speaking{background:linear-gradient(180deg,#ffd08a,var(--amber));box-shadow:0 0 22px rgba(255,182,72,.6)}
  .btn.ghost{
    background:transparent;color:var(--cyan);border:1px solid rgba(95,228,255,.42);
    box-shadow:none;font-size:10px;letter-spacing:.2em;padding:11px 18px;
  }
  .btn.ghost:hover{background:rgba(95,228,255,.08);box-shadow:0 0 18px rgba(95,228,255,.2)}
  .btn.ghost.rec{border-color:var(--amber);color:var(--amber);animation:blink 1s steps(1,end) infinite}
  .btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}

  .ticker{
    flex:1;overflow:hidden;white-space:nowrap;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  }
  .ticker div{display:inline-block;padding-left:100%;animation:scroll 42s linear infinite;font-size:11.5px;letter-spacing:.14em;color:var(--cyan-dim)}
  .ticker b{color:var(--text);font-weight:400}
  .ticker .sep{color:var(--cyan-deep);padding:0 18px}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

  /* ---------- answer toast ---------- */
  .toast{
    position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(10px);
    max-width:min(620px,72vw);padding:15px 20px;border:1px solid var(--hud-line);border-radius:5px;
    background:rgba(4,10,22,.9);backdrop-filter:blur(7px);color:var(--text);
    font-size:12.5px;line-height:1.65;letter-spacing:.03em;
    box-shadow:0 0 40px rgba(0,0,0,.7),0 0 0 1px rgba(95,228,255,.06) inset;
    opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
    max-height:34vh;overflow:auto;white-space:pre-wrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .who{font-family:'Orbitron',sans-serif;font-size:8.5px;letter-spacing:.28em;color:var(--cyan-dim);display:block;margin-bottom:8px;text-transform:uppercase}

  @media (max-width:1100px){
    .ll,.rr{display:none}
    .bottom{gap:34px;bottom:104px}
    .fig .v{font-size:26px}
  }
  @media (max-width:680px){
    .brand{font-size:19px;letter-spacing:.3em}
    .clock{font-size:22px}
    .bar-bottom{gap:12px;padding:0 14px}
    .ticker{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .ticker div{animation:none}
    .dot.off{animation:none}
  }
</style>
</head>
<body>

<canvas id="sphere"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="grain"></div>

<div class="hud">
  <!-- top left -->
  <div class="tl">
    <div class="brand">J.<span>A</span>.R.<span>V</span>.I.S</div>
    <div class="sub">Just A Rather Very Intelligent System</div>
    <div class="rule" style="width:210px"></div>
    <div class="greeting" id="greeting">Standing by.</div>
    <div class="gen" id="generated"></div>
  </div>

  <!-- top right -->
  <div class="tr">
    <div class="clock" id="clock">--:--<small id="secs">--</small></div>
    <div class="date" id="today"></div>
    <div class="rule" style="width:100%;background:linear-gradient(270deg,var(--hud-line),transparent)"></div>
    <div class="label" style="margin-bottom:9px">Connectors</div>
    <div class="conns" id="conns"></div>
  </div>

  <!-- left: activity log -->
  <div class="ll">
    <div class="label">Activity</div>
    <div class="rule" style="width:150px"></div>
    <ul class="log" id="log"></ul>
    <div style="font-size:11px;color:var(--cyan-deep);letter-spacing:.1em">&gt; <span class="caret"></span></div>
  </div>

  <!-- right: stats -->
  <div class="rr">
    <div class="label" style="text-align:right">Content funnel</div>
    <div class="rule" style="width:100%;background:linear-gradient(270deg,var(--hud-line),transparent)"></div>
    <div id="bars"></div>
  </div>

  <!-- bottom figures -->
  <div class="bottom" id="figs"></div>
  <div class="chip" id="chip"><span class="d"></span><span id="chipText"></span></div>

  <!-- answer toast -->
  <div class="toast" id="toast"><span class="who">J.A.R.V.I.S</span><span id="toastBody"></span></div>

  <!-- bottom bar -->
  <div class="bar-bottom">
    <button class="btn" id="briefBtn">BRIEF ME</button>
    <button class="btn ghost" id="micBtn" title="Hold to speak (needs the local server)">🎙 SPEAK</button>
    <div class="ticker"><div id="tickerText"></div></div>
    <button class="btn ghost" id="firstBtn">WHAT SHOULD I HANDLE FIRST</button>
  </div>
</div>

<audio id="briefAudio" src="jarvis_brief.mp3" preload="none" hidden></audio>
<script src="jarvis_data.js"></script>
<script>
(() => {
  "use strict";

  const D = window.JARVIS_DATA || {};
  const $ = (id) => document.getElementById(id);
  const nfmt = (n) => {
    if (typeof n !== "number") return String(n ?? "—");
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
    return String(n);
  };

  /* ============================================================
     1. THE SPHERE  —  ~680 points, Fibonacci distribution,
        tilted + slowly rotating, retina-aware, breathes when
        idle and pulses to a synthetic speech envelope when
        speaking.
     ============================================================ */
  const cv = $("sphere");
  const ctx = cv.getContext("2d", { alpha: true });
  const N = 680;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const TILT = -0.42;                       // fixed tilt on X
  const pts = new Array(N);

  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;        // 1 .. -1
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = GOLDEN * i;
    pts[i] = {
      x: Math.cos(th) * r,
      y: y,
      z: Math.sin(th) * r,
      // per-point twinkle offset, deterministic (no Math.random in the loop)
      tw: (i * 2.399963) % (Math.PI * 2)
    };
  }

  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2 - Math.min(38, H * 0.045);
    R = Math.min(W, H) * 0.215;
  }
  resize();
  window.addEventListener("resize", resize);

  // --- speaking state + synthetic speech envelope -------------
  let speaking = false;
  let env = 0;              // 0..1 smoothed amplitude
  let speakStart = 0;

  // A synthetic envelope: syllable-rate oscillation gated by
  // slower "phrase" and "breath" terms, so it reads as speech
  // rather than a metronome. Deterministic => works offline.
  function speechEnvelope(t) {
    const syl    = Math.abs(Math.sin(t * 7.4));                 // syllables
    const syl2   = Math.abs(Math.sin(t * 11.9 + 1.2)) * 0.55;   // consonant chatter
    const phrase = 0.55 + 0.45 * Math.sin(t * 1.35 + 0.6);      // phrase contour
    const breath = Math.sin(t * 0.33) > -0.86 ? 1 : 0.12;       // pauses to breathe
    return Math.min(1, (syl * 0.62 + syl2) * phrase * breath);
  }

  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;

    // envelope target: speech when speaking, gentle breath when idle
    const target = speaking
      ? speechEnvelope((now - speakStart) / 1000)
      : 0.12 + 0.10 * Math.sin(t * 0.85);
    env += (target - env) * (speaking ? 0.22 : 0.06);   // attack/release

    const pulse = 1 + env * (speaking ? 0.16 : 0.05);
    const spin  = t * (speaking ? 0.30 : 0.17);

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(CX, CY);

    const rad = R * pulse;

    /* ---- soft radial glow behind everything ---- */
    const glow = ctx.createRadialGradient(0, 0, rad * 0.05, 0, 0, rad * 3.05);
    glow.addColorStop(0,    `rgba(95,228,255,${0.26 + env * 0.30})`);
    glow.addColorStop(0.18, `rgba(60,190,235,${0.11 + env * 0.13})`);
    glow.addColorStop(0.46, "rgba(24,110,150,0.05)");
    glow.addColorStop(1,    "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, rad * 3.05, 0, Math.PI * 2); ctx.fill();

    /* ---- faint radial rays ---- */
    ctx.save();
    ctx.rotate(t * 0.045);
    ctx.lineWidth = 1;
    for (let i = 0; i < 48; i++) {
      const a  = (i / 48) * Math.PI * 2;
      const on = (i % 3 === 0) ? 1 : 0.42;
      const r1 = rad * 1.30, r2 = rad * (1.62 + 0.5 * Math.abs(Math.sin(i * 1.7 + t * 0.5)));
      ctx.strokeStyle = `rgba(95,228,255,${0.045 * on + env * 0.03})`;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.restore();

    /* ---- three concentric dashed HUD arcs, different speeds ---- */
    const arcs = [
      { r: 1.42, from: 0.00, len: 1.55, sp:  0.26, w: 1.4, dash: [2, 9],  a: 0.42 },
      { r: 1.66, from: 2.60, len: 2.35, sp: -0.17, w: 1.0, dash: [16, 12], a: 0.30 },
      { r: 1.92, from: 1.10, len: 1.05, sp:  0.09, w: 2.0, dash: [3, 15], a: 0.22 }
    ];
    for (const A of arcs) {
      ctx.save();
      ctx.rotate(t * A.sp);
      ctx.setLineDash(A.dash);
      ctx.lineWidth = A.w;
      ctx.strokeStyle = `rgba(95,228,255,${A.a + env * 0.16})`;
      ctx.shadowBlur = 12; ctx.shadowColor = "rgba(95,228,255,.55)";
      ctx.beginPath(); ctx.arc(0, 0, rad * A.r, A.from, A.from + A.len); ctx.stroke();
      // mirrored stub for balance
      ctx.beginPath(); ctx.arc(0, 0, rad * A.r, A.from + Math.PI, A.from + Math.PI + A.len * 0.34); ctx.stroke();
      ctx.restore();
    }
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    /* ---- outer ring of tick marks ---- */
    ctx.save();
    ctx.rotate(-t * 0.035);
    for (let i = 0; i < 96; i++) {
      const a   = (i / 96) * Math.PI * 2;
      const maj = i % 8 === 0;
      const len = maj ? 13 : 6;
      const r1  = rad * 2.18;
      ctx.strokeStyle = `rgba(95,228,255,${maj ? 0.40 : 0.16})`;
      ctx.lineWidth = maj ? 1.7 : 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * (r1 + len), Math.sin(a) * (r1 + len));
      ctx.stroke();
    }
    ctx.restore();

    /* ---- the point sphere ---- */
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
    const cosS = Math.cos(spin), sinS = Math.sin(spin);
    const FOV  = 3.05;

    for (let i = 0; i < N; i++) {
      const p = pts[i];
      // spin around Y
      const x1 = p.x * cosS + p.z * sinS;
      const z1 = -p.x * sinS + p.z * cosS;
      // tilt around X
      const y2 = p.y * cosT - z1 * sinT;
      const z2 = p.y * sinT + z1 * cosT;

      const persp = FOV / (FOV + z2);
      const sx = x1 * rad * persp;
      const sy = y2 * rad * persp;

      const depth = (z2 + 1) / 2;                       // 0 back .. 1 front
      const twk   = 0.78 + 0.22 * Math.sin(t * 2.1 + p.tw);
      const alpha = (0.16 + depth * 0.74) * twk * (0.72 + env * 0.5);
      const size  = (0.65 + depth * 1.55) * persp * (1 + env * 0.28);

      ctx.fillStyle = depth > 0.72
        ? `rgba(190,246,255,${Math.min(1, alpha)})`
        : `rgba(95,228,255,${Math.min(1, alpha)})`;
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(0.4, size), 0, Math.PI * 2);
      ctx.fill();
    }

    /* ---- bright pulsing core ---- */
    const coreR = rad * (0.30 + env * 0.16);
    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
    core.addColorStop(0,   `rgba(255,255,255,${0.90 + env * 0.10})`);
    core.addColorStop(0.16,`rgba(200,248,255,${0.72 + env * 0.20})`);
    core.addColorStop(0.44,`rgba(95,228,255,${0.26 + env * 0.24})`);
    core.addColorStop(1,   "rgba(95,228,255,0)");
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI * 2); ctx.fill();

    /* ---- tilted elliptical orbital ring + orbiting marker ---- */
    const ORB_RX = rad * 1.72, ORB_RY = rad * 0.50, ORB_TILT = -0.36;
    ctx.save();
    ctx.rotate(ORB_TILT);
    ctx.strokeStyle = `rgba(95,228,255,${0.30 + env * 0.16})`;
    ctx.lineWidth = 1.2;
    ctx.shadowBlur = 14; ctx.shadowColor = "rgba(95,228,255,.5)";
    ctx.beginPath(); ctx.ellipse(0, 0, ORB_RX, ORB_RY, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;

    const oa = t * 0.62;
    const ox = Math.cos(oa) * ORB_RX, oy = Math.sin(oa) * ORB_RY;
    const front = Math.sin(oa) > 0;                       // in front of the sphere?
    const mg = ctx.createRadialGradient(ox, oy, 0, ox, oy, 17);
    mg.addColorStop(0, `rgba(235,253,255,${front ? 1 : 0.5})`);
    mg.addColorStop(0.3, `rgba(95,228,255,${front ? 0.75 : 0.3})`);
    mg.addColorStop(1, "rgba(95,228,255,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(ox, oy, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${front ? 1 : 0.45})`;
    ctx.beginPath(); ctx.arc(ox, oy, front ? 3 : 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============================================================
     2. HUD BINDING  —  everything below reads from JARVIS_DATA
     ============================================================ */
  $("greeting").textContent = D.greeting || "Standing by.";
  $("generated").textContent = D.generated ? "BRIEF GENERATED " + String(D.generated).toUpperCase() : "";

  // clock
  function tick() {
    const n = new Date();
    const hh = String(n.getHours()).padStart(2, "0");
    const mm = String(n.getMinutes()).padStart(2, "0");
    const ss = String(n.getSeconds()).padStart(2, "0");
    $("clock").innerHTML = `${hh}:${mm}<small id="secs">${ss}</small>`;
    $("today").textContent = n.toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "short", year: "numeric"
    });
  }
  tick(); setInterval(tick, 1000);

  // connectors
  const connWrap = $("conns");
  (D.connectors || []).forEach((c) => {
    const on = (c.status || "").toLowerCase() === "online";
    const el = document.createElement("div");
    el.className = "conn";
    el.innerHTML = `<span class="st">${on ? "ONLINE" : "OFFLINE"}</span>` +
                   `<span class="nm">${c.name}</span>` +
                   `<span class="dot ${on ? "on" : "off"}"></span>`;
    connWrap.appendChild(el);
  });

  // content funnel bars
  const funnel = (D.content && D.content.funnel) || [];
  const peak = Math.max(1, ...funnel.map((f) => Number(f.value) || 0));
  const barsWrap = $("bars");
  funnel.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "bar";
    el.innerHTML = `<div class="bl"><span>${f.label}</span><b>${nfmt(Number(f.value))}</b></div>
                    <div class="track"><div class="fill"></div></div>`;
    barsWrap.appendChild(el);
    // Square-root scale, not linear. A funnel that runs 128,000 -> 96 is a
    // flat line on a linear axis; every stage below the first vanishes.
    // The exact figure is printed beside each bar, so the bar only has to
    // carry the shape.
    const pct = Math.max(5, Math.sqrt((Number(f.value) || 0) / peak) * 100);
    setTimeout(() => { el.querySelector(".fill").style.width = pct + "%"; }, 260 + i * 130);
  });

  // bottom figures — pulled off the funnel + sponsors
  const sponsors = D.sponsors || [];
  const paid = sponsors.filter((s) => (s.status || "").toLowerCase() === "paid");
  const due  = sponsors.filter((s) => (s.status || "").toLowerCase() !== "paid");
  const sum  = (arr) => arr.reduce((a, s) => a + (Number(s.amount) || 0), 0);
  const cur  = D.currency || "₪";

  const figures = (D.figures && D.figures.length ? D.figures : [
    funnel[0] ? { key: funnel[0].label, value: nfmt(Number(funnel[0].value)) } : null,
    funnel[funnel.length - 1] ? { key: funnel[funnel.length - 1].label, value: nfmt(Number(funnel[funnel.length - 1].value)) } : null,
    { key: "Collected", value: cur + nfmt(sum(paid)) },
    { key: "Outstanding", value: cur + nfmt(sum(due)) },
    { key: "Priorities", value: String((D.priorities || []).length) }
  ].filter(Boolean));

  const figWrap = $("figs");
  figures.forEach((f) => {
    const el = document.createElement("div");
    el.className = "fig";
    el.innerHTML = `<div class="v">${f.value}</div><div class="k">${f.key}</div>`;
    figWrap.appendChild(el);
  });

  // amber payment-due chip
  if (due.length) {
    const first = due[0];
    $("chipText").textContent =
      `PAYMENT DUE — ${first.name} · ${cur}${nfmt(Number(first.amount) || 0)}` +
      (first.due ? ` · ${first.due}` : "") +
      (due.length > 1 ? ` · +${due.length - 1} MORE` : "");
    $("chip").classList.add("show");
  }

  // ticker
  const tickerBits = [D.headline, ...(D.priorities || []), D.closer].filter(Boolean);
  $("tickerText").innerHTML = tickerBits.length
    ? tickerBits.map((s) => `<b>${s}</b>`).join('<span class="sep">◆</span>') +
      '<span class="sep">◆</span>' + tickerBits.map((s) => `<b>${s}</b>`).join('<span class="sep">◆</span>')
    : "<b>All systems nominal.</b>";

  /* ---- streaming activity log, one line at a time ---- */
  const logEl = $("log");
  const stamp = (i) => {
    const d = new Date(Date.now() - (8 - i) * 37000);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  const logLines = (D.activity && D.activity.length ? D.activity : [
    ...(D.connectors || []).map((c) =>
      (c.status || "").toLowerCase() === "online"
        ? `${c.name} connector handshake OK`
        : `${c.name} connector unreachable — retrying`),
    funnel.length ? `Content funnel pulled — ${funnel.length} stages` : null,
    sponsors.length ? `Sponsor ledger reconciled — ${paid.length} paid, ${due.length} outstanding` : null,
    (D.priorities || []).length ? `Priority queue built — ${(D.priorities || []).length} items` : null,
    "Morning brief compiled",
    "Awaiting instruction"
  ].filter(Boolean));

  let li = 0;
  function pushLog() {
    if (li >= logLines.length) { li = 0; logEl.innerHTML = ""; }
    const el = document.createElement("li");
    el.innerHTML = `<span class="t">${stamp(li % 9)}</span><span>${logLines[li]}</span>`;
    el.classList.add("fresh");
    logEl.appendChild(el);
    setTimeout(() => el.classList.remove("fresh"), 1600);
    while (logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
    li++;
  }
  pushLog();
  setInterval(pushLog, 2100);

  /* ============================================================
     3. BRIEF ME  —  plays jarvis_brief.mp3 and drives the
        speaking flag. Falls back to the synthetic envelope
        alone if the MP3 isn't there yet.
     ============================================================ */
  const audio    = $("briefAudio");
  const briefBtn = $("briefBtn");
  let fallbackTimer = null;

  function startSpeaking() {
    speaking = true;
    speakStart = performance.now();
    briefBtn.classList.add("speaking");
    briefBtn.textContent = "SPEAKING";
  }
  function stopSpeaking() {
    speaking = false;
    briefBtn.classList.remove("speaking");
    briefBtn.textContent = "BRIEF ME";
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
  }

  briefBtn.addEventListener("click", () => {
    if (speaking) { audio.pause(); audio.currentTime = 0; stopSpeaking(); return; }
    startSpeaking();
    audio.play().catch(() => {
      // No jarvis_brief.mp3 yet (or autoplay blocked) — still pulse,
      // so the dashboard is demoable before you generate the audio.
      fallbackTimer = setTimeout(stopSpeaking, 14000);
    });
  });
  audio.addEventListener("ended", stopSpeaking);
  audio.addEventListener("error", () => {
    if (speaking && !fallbackTimer) fallbackTimer = setTimeout(stopSpeaking, 14000);
  });

  /* ============================================================
     4. TALKING TO IT  —  mic + /ask, via the local server.
        Uses the browser's Web Speech API for speech-to-text,
        posts the transcript to /ask (which runs `claude -p`),
        then speaks the reply back through Fish Audio.
        Degrades to a typed prompt when opened as a file://.
     ============================================================ */
  const micBtn = $("micBtn");
  const firstBtn = $("firstBtn");
  const toast = $("toast");
  const toastBody = $("toastBody");
  const SERVED = location.protocol === "http:" || location.protocol === "https:";

  function say(text) {
    toastBody.textContent = text;
    toast.classList.add("show");
  }
  function hideToast(after) { setTimeout(() => toast.classList.remove("show"), after); }

  async function ask(question) {
    if (!SERVED) {
      say("The mic and /ask need the local server.\n\n  cd jarvis && python3 server.py\n\nThen open http://localhost:8765 — not the .html file directly.");
      hideToast(9000);
      return;
    }
    say("Thinking…");
    micBtn.disabled = true; firstBtn.disabled = true;
    try {
      const r = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
      say(data.reply || "(empty reply)");

      if (data.audio_url) {
        const a = new Audio(data.audio_url);
        startSpeaking();
        a.addEventListener("ended", () => { stopSpeaking(); hideToast(4000); });
        a.addEventListener("error", () => { stopSpeaking(); hideToast(9000); });
        a.play().catch(() => { stopSpeaking(); hideToast(9000); });
      } else {
        // No Fish Audio key configured — show the text, pulse briefly.
        startSpeaking();
        setTimeout(() => { stopSpeaking(); hideToast(6000); }, 2200);
      }
    } catch (e) {
      say("Couldn't reach Claude: " + e.message);
      hideToast(9000);
    } finally {
      micBtn.disabled = false; firstBtn.disabled = false;
      micBtn.classList.remove("rec");
      micBtn.textContent = "🎙 SPEAK";
    }
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, listening = false;

  micBtn.addEventListener("click", () => {
    if (!SERVED) { ask(""); return; }
    if (!SR) {
      const typed = prompt("Speech recognition isn't available in this browser. Type your question:");
      if (typed) ask(typed);
      return;
    }
    if (listening && recog) { recog.stop(); return; }

    recog = new SR();
    recog.lang = D.lang || "en-GB";
    recog.interimResults = false;
    recog.maxAlternatives = 1;

    recog.onstart = () => {
      listening = true;
      micBtn.classList.add("rec");
      micBtn.textContent = "● LISTENING";
    };
    recog.onresult = (ev) => {
      const said = ev.results[0][0].transcript;
      say("You: " + said);
      ask(said);
    };
    recog.onerror = (ev) => {
      say("Mic error: " + ev.error + (ev.error === "not-allowed" ? " — allow microphone access for this site." : ""));
      hideToast(8000);
    };
    recog.onend = () => {
      listening = false;
      micBtn.classList.remove("rec");
      if (!micBtn.disabled) micBtn.textContent = "🎙 SPEAK";
    };
    recog.start();
  });

  firstBtn.addEventListener("click", () => {
    ask(D.firstQuestion ||
      "Looking at my priorities for today, what should I handle first and why? Two sentences.");
  });

  // Esc dismisses the toast
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") toast.classList.remove("show");
  });
})();
</script>
</body>
</html>
